# nvrWay — development compose (build-based)
#
# Skeleton from the plan's Step 0 (card S0-03); the content is cards S9-01..S9-06.
# Six services: postgres, go2rtc, server, detector, web, and MinIO commented
# out below the way OurWay comments its agent service. `scripts/dev.sh` runs
# this file; `docker-compose.prod.yml` is the deployment file.
#
# Conventions copied from OurWay/docker/docker-compose.yml: named project,
# `container_name: nvr-*`, `restart: unless-stopped`, json-file logging capped
# at 10m x 3, a bridge network `nvr_net`, named volumes, and healthchecks that
# `depends_on` gates on with `condition: service_healthy`.

name: nvr

services:
  postgres:
    image: postgres:16-alpine
    container_name: nvr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nvr
      POSTGRES_PASSWORD: nvr
      POSTGRES_DB: nvr
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nvr_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nvr -d nvr"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: &nvr_logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # go2rtc ships FFmpeg, so the recorder's `ffmpeg:` sources resolve inside it.
  # The server re-renders this service's whole config from the camera rows
  # (server/go2rtc/config.go -> POST /api/config), so the config file is never
  # hand-edited — S3-02, S3-05. That includes the API credentials: the renderer
  # writes GO2RTC_USERNAME / GO2RTC_PASSWORD into `api: { username, password }`,
  # and go2rtc enforces them for every non-localhost caller (its `local_auth`
  # stays off, so this service's own healthcheck needs no credentials). No
  # GO2RTC_* env here on purpose: the default listens are exactly the ports
  # below, and credentials the sidecar learned from env but the renderer did
  # not would be silently erased by the first config push.
  go2rtc:
    image: ghcr.io/alexxit/go2rtc:master
    container_name: nvr-go2rtc
    restart: unless-stopped
    environment:
      TZ: UTC
    ports:
      - "1984:1984"
      - "8554:8554"
      # WebRTC media: TCP and UDP on the same port.
      - "8555:8555"
      - "8555:8555/udp"
    volumes:
      - go2rtc_config:/config
      # Demo-only (S10-02): the pinned fixture the demo camera's `exec:` source
      # reads, so a camera-free stack can be recorded and detected. Dev file,
      # never in prod. Relative to this file, hence ../.
      - ../testdata:/fixtures:ro
    networks:
      - nvr_net
    healthcheck:
      # localhost bypasses the API auth (go2rtc's local_auth is off), so the
      # probe needs no credentials even after the server has pushed them.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:1984/api/streams || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *nvr_logging

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
      args:
        VERSION: ${VERSION:-0.1.0}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: nvr/server:latest
    container_name: nvr-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      go2rtc:
        condition: service_healthy
    environment:
      SERVER_PORT: ":8080"
      DATABASE_URL: "postgresql://nvr:nvr@postgres:5432/nvr?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:-}
      NVR_SECRET_KEY: ${NVR_SECRET_KEY:-}
      DATA_DIR: /var/lib/nvr
      GO2RTC_URL: "http://go2rtc:1984"
      GO2RTC_RTSP_URL: "rtsp://go2rtc:8554"
      GO2RTC_USERNAME: ${GO2RTC_USERNAME:-}
      GO2RTC_PASSWORD: ${GO2RTC_PASSWORD:-}
      GO2RTC_PUBLIC_URL: ${GO2RTC_PUBLIC_URL:-http://localhost:1984}
      WORKER_TOKEN: ${WORKER_TOKEN:-}
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      TZ: UTC
    ports:
      - "8080:8080"
    volumes:
      - nvr_data:/var/lib/nvr
    networks:
      - nvr_net
    healthcheck:
      # Liveness only — /health never touches the database (S1-13).
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *nvr_logging

  # The detection worker: no listener of its own, so its healthcheck is the
  # process check (S9-02). It polls config and POSTs signals over the internal
  # API, authenticated by WORKER_TOKEN.
  detector:
    build:
      context: ..
      dockerfile: docker/Dockerfile.detector
    image: nvr/detector:latest
    container_name: nvr-detector
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      NVR_SERVER_URL: "http://server:8080"
      NVR_WORKER_TOKEN: ${WORKER_TOKEN:-}
      DET_PROVIDERS: ${DET_PROVIDERS:-CPUExecutionProvider}
      TZ: UTC
    volumes:
      - nvr_models:/models
    networks:
      - nvr_net
    healthcheck:
      # The plan's `pgrep -f nvr_detector` cannot run here: python:3.12-slim
      # ships no procps, and a healthcheck whose binary is missing is an
      # always-unhealthy service. PID 1 of this container IS the worker
      # (exec-form CMD), so its cmdline is the process check — no new package.
      test: ["CMD-SHELL", "grep -q nvr_detector /proc/1/cmdline || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *nvr_logging

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    image: nvr/web:latest
    container_name: nvr-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      # nginx serves on 8080 (an unprivileged user cannot bind 80), so the
      # published port maps to 8080 — README's "console on :3000".
      - "3000:8080"
    networks:
      - nvr_net
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget prefers ::1 and nginx's
      # `listen 8080` is IPv4-only — a localhost probe is connection refused.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *nvr_logging

  # Optional MinIO for the storage-tier steps of scripts/verify.sh (S7-10,
  # S10-03). Commented the way OurWay comments its agent service: uncomment
  # and add an s3 backend pointing at http://minio:9000.
  # minio:
  #   image: minio/minio:latest
  #   container_name: nvr-minio
  #   restart: unless-stopped
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: nvr
  #     MINIO_ROOT_PASSWORD: nvrsecret
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - minio_data:/data
  #   networks:
  #     - nvr_net
  #   logging: *nvr_logging

networks:
  nvr_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  go2rtc_config:
    driver: local
  nvr_data:
    driver: local
  nvr_models:
    driver: local
  # minio_data:
  #   driver: local
