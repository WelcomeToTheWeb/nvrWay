# nvrWay Console — nginx configuration (skeleton, card S0-03)
#
# Shape is OurWay's docker/nginx.conf (MIT); card S9-03 finishes and verifies
# it. Serves the built SPA and proxies the API + WebSocket to the server.
# Clips are streamed through the server, so one location needs buffering off.

server {
    # Non-root nginx cannot bind ports below 1024 (the image runs as the
    # unprivileged 'nginx' user), so the container serves on 8080 and compose
    # publishes 3000:8080.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API proxy. $http_host keeps the port: the console derives WEB_URL and the
    # OIDC redirect URI from the host it is actually on.
    location /api/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Event clips are proxied by the server — local files with Range support,
    # remote-tier objects streamed from byte 0 with no seek (S6-05). Buffering
    # the whole body here would turn a Range request into a full download, so
    # this location disables it. S9-03 verifies it with the clip gate of
    # scripts/verify.sh.
    location ~ ^/api/v1/events/.*/clip$ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # WebSocket proxy. $http_host preserves the port ($host strips it), which
    # the server's same-origin WebSocket check relies on (S2-10).
    location /ws {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Live view is NOT proxied here: the console dials go2rtc directly at
    # GO2RTC_PUBLIC_URL (S8-04, S8-05).

    # SPA routing — try the file, then fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;

        location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/nvr-access.log;
    error_log /var/log/nginx/nvr-error.log;
}
