# nvrWay — development compose (build-based)
#
# Skeleton from the plan's Step 0 (card S0-03); the content is cards S9-01..S9-06.
# Six services: postgres, go2rtc, server, detector, web, and MinIO commented
# out below the way OurWay comments its agent service. `scripts/dev.sh` runs
# this file; `docker-compose.prod.yml` is the deployment file.
#
# It lives at the repo root on purpose: compose resolves every relative path
# (build contexts, bind mounts) and the default `.env` against the *base*
# compose file's directory, so all three files — this one, the prod file, and
# the GPU overlay — share one project directory and one `.env`. That is what
# makes `-f docker-compose.yml -f docker-compose.gpu.yml` resolve the same way
# it does with the prod base.
#
# Conventions copied from OurWay/docker/docker-compose.yml: named project,
# `container_name: nvr-*`, `restart: unless-stopped`, json-file logging capped
# at 10m x 3, a bridge network `nvr_net`, named volumes, and healthchecks that
# `depends_on` gates on with `condition: service_healthy`.

name: nvr

services:
  postgres:
    image: postgres:16-alpine
    container_name: nvr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nvr
      POSTGRES_PASSWORD: nvr
      POSTGRES_DB: nvr
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nvr_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nvr -d nvr"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: &nvr_logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # go2rtc ships FFmpeg, so the recorder's `ffmpeg:` sources resolve inside it.
  # The server re-renders this service's whole config from the camera rows
  # (server/go2rtc/config.go -> POST /api/config), so the config file is never
  # hand-edited — S3-02, S3-05. That includes the API credentials: the renderer
  # writes GO2RTC_USERNAME / GO2RTC_PASSWORD into `api: { username, password }`,
  # and go2rtc enforces them for every non-localhost caller (its `local_auth`
  # stays off, so this service's own healthcheck needs no credentials). No
  # GO2RTC_* env here on purpose: the default listens are exactly the ports
  # below, and credentials the sidecar learned from env but the renderer did
  # not would be silently erased by the first config push.
  go2rtc:
    image: ghcr.io/alexxit/go2rtc:master
    container_name: nvr-go2rtc
    restart: unless-stopped
    environment:
      TZ: UTC
    ports:
      - "1984:1984"
      - "8554:8554"
      # WebRTC media: TCP and UDP on the same port.
      - "8555:8555"
      - "8555:8555/udp"
    volumes:
      - go2rtc_config:/config
      # P-15: go2rtc reads api.origin only at process start, and the server's
      # rendered push arrives after that — so a sidecar on a fresh volume
      # would run the same-origin WS check and 403 the console (a different
      # port). The base template is seeded into the volume before go2rtc
      # starts, but only when the config is missing or empty: a persisted
      # config (with its streams) survives restarts, and the server's boot
      # push (S3-05) replaces the seed within seconds either way.
      # P-16: go2rtc's `POST /api/config` only writes the file — streams,
      # listens and the WS origin check are read once at boot and never
      # reloaded. The command below is a supervisor: it seeds the config,
      # runs go2rtc, and exits when the file's checksum changes, so
      # `restart: unless-stopped` boots the sidecar with what the server
      # just wrote. A camera save therefore costs the sidecar a restart
      # (live tiles blink, recorders respawn on their own backoff) instead
      # of silently never taking effect.
      - ./docker/go2rtc.yaml.template:/go2rtc.seed.yaml:ro
      # Demo-only (S10-02): the pinned fixture the demo camera's `exec:` source
      # reads, so a camera-free stack can be recorded and detected. Dev file,
      # never in prod.
      - ./testdata:/fixtures:ro
    # $$ escapes compose interpolation: these $vars belong to the container's
    # shell, not to this file's env.
    command:
      - sh
      - -c
      - |
        [ -s /config/go2rtc.yaml ] || cp /go2rtc.seed.yaml /config/go2rtc.yaml
        go2rtc -config /config/go2rtc.yaml &
        pid=$$!
        trap 'kill $$pid 2>/dev/null; exit 0' INT TERM
        last=$$(md5sum /config/go2rtc.yaml 2>/dev/null)
        while kill -0 $$pid 2>/dev/null; do
          sleep 2
          now=$$(md5sum /config/go2rtc.yaml 2>/dev/null)
          if [ "$$now" != "$$last" ]; then
            echo "go2rtc.yaml changed on disk (the server re-rendered it, S3-05); exiting so the fresh config is booted"
            kill $$pid 2>/dev/null
            exit 0
          fi
        done
        wait $$pid
    networks:
      - nvr_net
    healthcheck:
      # localhost bypasses the API auth (go2rtc's local_auth is off), so the
      # probe needs no credentials even after the server has pushed them.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:1984/api/streams || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *nvr_logging

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
      args:
        VERSION: ${VERSION:-0.1.0}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: nvr/server:latest
    container_name: nvr-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      go2rtc:
        condition: service_healthy
    # The whole server config surface arrives through env_file: every
    # variable .env.example advertises reaches the container. The old
    # hand-listed environment block passed 15 of the 39 — the rest (OIDC,
    # retention, rate limits, WS_ORIGINS, segment/roll timings, media dirs,
    # MJPEG tap sizing, PUBLIC_BASE_URL) were silently ignored, which is the
    # drift this line closes. The block below keeps only what compose itself
    # owns: the in-network wiring and the paths inside the container. Where
    # both name a variable, environment wins over env_file (compose
    # precedence). `required: false` keeps the fresh-clone scripts working:
    # detect-smoke.sh and coverage.sh run one service with a throwaway
    # --env-file and no .env, and compose resolves every service's env_file
    # even then. scripts/dev.sh always seeds .env first, so the dev path
    # never relies on the fallback.
    env_file:
      - path: .env
        required: false
    environment:
      SERVER_PORT: ":8080"
      DATABASE_URL: "postgresql://nvr:***@postgres:5432/nvr?sslmode=disable"
      DATA_DIR: /var/lib/nvr
      GO2RTC_URL: "http://go2rtc:1984"
      GO2RTC_RTSP_URL: "rtsp://go2rtc:8554"
      TZ: UTC
    ports:
      - "8080:8080"
    volumes:
      - nvr_data:/var/lib/nvr
    networks:
      - nvr_net
    healthcheck:
      # Liveness only — /health never touches the database (S1-13).
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *nvr_logging

  # The detection worker: no listener of its own, so its healthcheck is the
  # process check (S9-02). It polls config and POSTs signals over the internal
  # API, authenticated by WORKER_TOKEN.
  detector:
    build:
      context: .
      dockerfile: docker/Dockerfile.detector
      # Explicit, not "the last stage": the Dockerfile's final stage is the
      # GPU variant (S9-06), and a default build that silently became the
      # 2 GB CUDA image was the bug this line prevents. The GPU overlay
      # overrides this with `target: runtime-gpu`.
      target: runtime
    image: nvr/detector:latest
    container_name: nvr-detector
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      NVR_SERVER_URL: "http://server:8080"
      NVR_WORKER_TOKEN: ${WORKER_TOKEN:-}
      DET_PROVIDERS: ${DET_PROVIDERS:-CPUExecutionProvider}
      # The mjpeg tap is part of go2rtc's API, and that API enforces basic
      # auth from the sidecar's next boot once the server pushes
      # `api: {username, password}` (S9-04). Without these the tap reads a
      # 401 body forever and calls it "not an mjpeg stream".
      GO2RTC_USERNAME: ${GO2RTC_USERNAME:-}
      GO2RTC_PASSWORD: ${GO2RTC_PASSWORD:-}
      TZ: UTC
    volumes:
      - nvr_models:/models
    networks:
      - nvr_net
    healthcheck:
      # The plan's `pgrep -f nvr_detector` cannot run here: python:3.12-slim
      # ships no procps, and a healthcheck whose binary is missing is an
      # always-unhealthy service. PID 1 of this container IS the worker
      # (exec-form CMD), so its cmdline is the process check — no new package.
      test: ["CMD-SHELL", "grep -q nvr_detector /proc/1/cmdline || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *nvr_logging

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: nvr/web:latest
    container_name: nvr-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      # nginx serves on 8080 (an unprivileged user cannot bind 80), so the
      # published port maps to 8080 — README's "console on :3000".
      - "3000:8080"
    networks:
      - nvr_net
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget prefers ::1 and nginx's
      # `listen 8080` is IPv4-only — a localhost probe is connection refused.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *nvr_logging

  # Optional MinIO for the storage-tier steps of scripts/verify.sh (S7-10,
  # S10-03). Commented the way OurWay comments its agent service: uncomment
  # and add an s3 backend pointing at http://minio:9000.
  # minio:
  #   image: minio/minio:latest
  #   container_name: nvr-minio
  #   restart: unless-stopped
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: nvr
  #     MINIO_ROOT_PASSWORD: nvrsecret
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - minio_data:/data
  #   networks:
  #     - nvr_net
  #   logging: *nvr_logging

networks:
  nvr_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  go2rtc_config:
    driver: local
  nvr_data:
    driver: local
  nvr_models:
    driver: local
  # minio_data:
  #   driver: local
