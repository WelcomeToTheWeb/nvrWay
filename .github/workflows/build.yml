# nvrWay — CI (card S9-09)
#
# The four jobs the plan names (NVRWAY_V1_PLAN.md line 285), in OurWay's shape:
# `Server & Detector Tests`, `Web Tests`, `E2E`, `Build & Push`.
#
# Toolchains are pinned — go 1.26, python 3.12, node 22 — because "green" on a
# floating toolchain is a claim about whatever GitHub happened to install that
# day, not about this repo. The images publish the same way the prod compose
# consumes them: a `v*` tag publishes `:latest` and `:<tag>`; a push to `main`
# publishes `:edge` only. The versioned publish never fires outside a tag.
#
# The `preflight` gate is the skeleton doctrine that survives S9-09: each flag
# is a file, not a hope. The harness flag reads the `skeleton, card S0-04`
# marker in scripts/ — while any script is still a skeleton, the E2E job and
# the coverage-ratchet step are *visibly skipped*, because a job that reports
# green on a suite it did not run is worse than a skip. S9-08 removes the
# marker and those steps start running.
name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: welcometotheweb/nvr

# One publish at a time: a tag push and its main push race the same package and
# GHCR answers that race with "unknown blob" mid-push (OurWay's finding).
concurrency:
  group: ghcr-publish
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.probe.outputs.server }}
      detector: ${{ steps.probe.outputs.detector }}
      web: ${{ steps.probe.outputs.web }}
      harness: ${{ steps.probe.outputs.harness }}
    steps:
      - uses: actions/checkout@v4
      - id: probe
        run: |
          if [ -f server/go.mod ]; then echo server=true >> "$GITHUB_OUTPUT"; else echo server=false >> "$GITHUB_OUTPUT"; fi
          if [ -f detector/pyproject.toml ] && ls detector/tests/*.py >/dev/null 2>&1; then echo detector=true >> "$GITHUB_OUTPUT"; else echo detector=false >> "$GITHUB_OUTPUT"; fi
          if [ -f web/package.json ]; then echo web=true >> "$GITHUB_OUTPUT"; else echo web=false >> "$GITHUB_OUTPUT"; fi
          # The marker is the exact phrase every skeleton script carries; when
          # S9-08 fills the scripts in, the phrase goes and E2E starts running.
          if grep -lq "skeleton, card S0-04" scripts/*.sh; then echo harness=false >> "$GITHUB_OUTPUT"; else echo harness=true >> "$GITHUB_OUTPUT"; fi

  # Job 1 of four: Go suite + coverage ratchet + detector suite, on the pinned
  # toolchains the repo actually builds with (golang:1.26, python:3.12).
  server-tests:
    name: Server & Detector Tests
    needs: preflight
    if: needs.preflight.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum
      - name: Install ffmpeg
        # The media tests shell out to it (S4-07): the recorder and clip suites
        # are not skippable on CI.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Go suite
        run: cd server && go test ./... -count=1
      - name: Coverage ratchet
        # scripts/coverage.sh — OurWay's ratchet (S9-08); skipped while the
        # script is a skeleton, so the job never reports green on a floor it
        # did not measure.
        if: needs.preflight.outputs.harness == 'true'
        run: bash scripts/coverage.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detector suite
        # The plan's line: `pip install -e detector[dev] && pytest`. The dev
        # extra carries pytest and onnx==1.17.0 — the same serialiser the image
        # exports with (S5-12) — and the synthetic-model tests need it. The
        # slow marker (the real yolov8n.onnx smoke) is CI's job elsewhere: the
        # image build in Build & Push exercises the export path.
        if: needs.preflight.outputs.detector == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e "detector[dev]"
          pytest detector/tests -q -m "not slow"

  # Job 2 of four: typecheck + vitest, on the Node the plan pins. (The dev host
  # runs Node 26; the S8-02 findings — npm 11 install-script gating, the
  # webstorage shim — are host facts, and this job is where the plan's Node 22
  # answer gets read, not assumed.)
  web-tests:
    name: Web Tests
    needs: preflight
    if: needs.preflight.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: cd web && npm ci
      - name: Typecheck and unit tests
        run: cd web && npm run typecheck && npm run test:run

  # Job 3 of four: the Playwright suite against scripts/e2e-stack.sh — the
  # throwaway sqlite + `go run` on :9090 + vite preview stack, never a dev
  # database. Gated on the harness flag: while e2e-stack.sh is a skeleton this
  # job is visibly skipped.
  e2e:
    name: E2E
    needs: preflight
    if: needs.preflight.outputs.harness == 'true' && needs.preflight.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser
        run: cd web && npm ci && npm run test:e2e:install
      - name: Start the throwaway stack and run the specs
        # `test` runs the specs against a stack `restart` started — on a fresh
        # runner there is no state file, so the CI invocation is both, in order.
        run: scripts/e2e-stack.sh restart && scripts/e2e-stack.sh test

  # Job 4 of four: publish the three images. A `v*` tag publishes `:latest` and
  # `:<tag>`; a push to `main` publishes `:edge` and nothing else — the
  # versioned publish fires on tag only.
  build-and-push:
    name: Build & Push
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          P="${REGISTRY}/${IMAGE_PREFIX}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            T="${GITHUB_REF#refs/tags/}"
          else
            T="edge"
          fi
          {
            echo "version=$T"
            echo "server=$P/server:latest,$P/server:$T"
            echo "web=$P/web:latest,$P/web:$T"
            echo "detector=$P/detector:latest,$P/detector:$T"
          } >> "$GITHUB_OUTPUT"
          # On main, `latest` is not ours to move: only the tag pushes it.
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "server=$P/server:edge"      >> "$GITHUB_OUTPUT"
            echo "web=$P/web:edge"            >> "$GITHUB_OUTPUT"
            echo "detector=$P/detector:edge"  >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: docker/Dockerfile.server
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.tags.outputs.server }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: docker/Dockerfile.web
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.web }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: docker/Dockerfile.detector
          tags: ${{ steps.tags.outputs.detector }}
